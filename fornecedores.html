{% extends "base.html" %}{% block content %}<div class="page-heading"><div><span class="eyebrow blue">PARCEIROS</span><h1>Fornecedores</h1><p>Organize os contatos de quem abastece a cozinha.</p></div></div><section class="panel"><form method="post" class="form-grid"><label>Nome do fornecedor<input name="nome" required></label><label>Contato<input name="contato" placeholder="Telefone ou e-mail"></label><button class="primary">＋ Adicionar fornecedor</button></form></section><section class="panel"><h2>Fornecedores cadastrados</h2><table><tr><th>Nome</th><th>Contato</th></tr>{% for f in fornecedores %}<tr><td>{{f.nome}}</td><td>{{f.contato or '—'}}</td></tr>{% else %}<tr><td colspan="2">Nenhum fornecedor cadastrado.</td></tr>{% endfor %}</table></section>{% endblock %}
